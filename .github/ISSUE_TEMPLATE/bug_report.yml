name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Chiasm. Please do not include passwords, API keys, Provider Bridge tokens, or copyrighted media.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows
        - Android
        - Linux / source build
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chiasm version
      placeholder: "e.g. v0.1.1"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Music source
      options:
        - Local Files
        - Jamendo
        - Third-party provider
        - Provider Bridge
        - Not source-related
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click…
        3. Play…
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: For desktop source/plugin problems, Sources → Show power tools → Export diagnostics… can create a support JSON. Review it before attaching or pasting relevant parts.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, private URLs and personal paths before posting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I have removed passwords, API keys, Bridge tokens and other secrets.
          required: true
