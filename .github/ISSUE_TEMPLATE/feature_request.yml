name: Feature request
description: Suggest an improvement to Chiasm
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the listening or workflow problem first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: Describe the feature or interaction you have in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Flow / sequencing
        - Taste memory / rediscovery
        - Library / playback
        - UI / UX
        - Android
        - Providers
        - Optional AI / LLM integration
        - Developer tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — how do you solve this today?
