name: Plugin / provider proposal
description: Propose a new Chiasm provider or capability extension
title: "[Plugin]: "
labels: ["ecosystem"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of extension?
      options:
        - Music source / playback provider
        - Identity / metadata
        - Artwork
        - Lyrics
        - Playlist import/export
        - Scrobbling / listening history
        - API / automation
        - Other
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Extension repository
      description: Link to the public source repository if it already exists.
      placeholder: https://github.com/example/example-plugin
  - type: input
    id: source
    attributes:
      label: Upstream source / service
      description: Name the API, service, archive or system the extension integrates.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: What would this add to Chiasm?
      description: Keep this focused on one useful capability where possible.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: API / access method
      description: Link or describe the documented access method, authentication and rate limit if known.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Expected permissions
      description: Network hosts, local file access, browser authentication, offline downloads, or other access.
  - type: textarea
    id: rights
    attributes:
      label: Source policy / rights notes
      description: What is known about API terms, media/data rights, attribution, caching/download and commercial restrictions?
    validations:
      required: true
  - type: textarea
    id: package
    attributes:
      label: Package / registry information
      description: If ready, include the .mdxprovider/.mdxplugin release URL, version, SHA-256 and byte size.
