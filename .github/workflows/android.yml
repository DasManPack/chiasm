name: Build Android
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive the built assets
        required: false
        type: string
      release_sha:
        description: Optional exact commit SHA to build for a release
        required: false
        type: string
  pull_request:
    paths:
      - 'android/**'
      - 'VERSION'
      - 'scripts/version_check.py'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify app version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python scripts/version_check.py --release-tag "$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/version_check.py --release-tag "$GITHUB_REF_NAME"
          else
            python scripts/version_check.py
          fi
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build directly installable APK and Play Store bundle
        working-directory: android
        run: |
          gradle :app:assembleDebug :app:bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk Chiasm-Android.apk
          cp app/build/outputs/bundle/release/app-release.aab Chiasm-Android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Chiasm-Android
          path: |
            android/Chiasm-Android.apk
            android/Chiasm-Android.aab
      - name: Attach Android assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            android/Chiasm-Android.apk
            android/Chiasm-Android.aab
