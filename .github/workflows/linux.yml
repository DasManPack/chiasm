name: Build Linux packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive the built assets
        required: false
        type: string
      release_sha:
        description: Optional exact commit SHA to build for a release
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify app version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python scripts/version_check.py --release-tag "$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/version_check.py --release-tag "$GITHUB_REF_NAME"
          else
            python scripts/version_check.py
          fi
      - name: Install Linux runtime and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils desktop-file-utils dpkg-dev file \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - name: Build .deb and AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          chmod +x desktop/build_linux.sh
          BUILD_ARGS=()
          if [[ -z "$RELEASE_TAG" && "$GITHUB_REF" != refs/tags/* ]]; then
            APP_VERSION="$(tr -d '\r\n' < VERSION)"
            if [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
              BUILD_ARGS+=(--allow-development)
            fi
          fi
          desktop/build_linux.sh "${BUILD_ARGS[@]}"
      - name: Validate package metadata
        run: |
          desktop-file-validate desktop/linux/io.github.cliff_lee.Chiasm.desktop
          dpkg-deb --info desktop/dist/Chiasm-linux-x86_64.deb
          dpkg-deb --contents desktop/dist/Chiasm-linux-x86_64.deb
          test -x desktop/dist/Chiasm-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Chiasm-Linux-x86_64
          path: |
            desktop/dist/Chiasm-linux-x86_64.deb
            desktop/dist/Chiasm-linux-x86_64.AppImage

  smoke-ubuntu:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Chiasm-Linux-x86_64
          path: linux-artifacts
      - name: Install the .deb and run packaged GUI checks
        run: |
          sudo apt-get update
          sudo apt-get install -y ./linux-artifacts/Chiasm-linux-x86_64.deb
          chmod +x linux-artifacts/Chiasm-linux-x86_64.AppImage
          python3 desktop/linux/smoke_launch.py /usr/bin/chiasm
          python3 desktop/linux/smoke_launch.py linux-artifacts/Chiasm-linux-x86_64.AppImage --appimage
      - name: Measure installed .deb startup
        run: |
          python3 scripts/packaged_startup_probe.py \
            /usr/bin/chiasm \
            --output "packaged-startup-deb-${{ matrix.os }}.json"
      - name: Measure AppImage startup
        run: |
          python3 scripts/packaged_startup_probe.py \
            linux-artifacts/Chiasm-linux-x86_64.AppImage \
            --appimage \
            --output "packaged-startup-appimage-${{ matrix.os }}.json"
      - name: Upload Linux packaged startup measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Packaged-startup-Linux-${{ matrix.os }}
          path: |
            packaged-startup-deb-${{ matrix.os }}.json
            packaged-startup-appimage-${{ matrix.os }}.json
          if-no-files-found: warn
      - name: Validate AppStream metadata
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
          appstreamcli validate --no-net desktop/linux/io.github.cliff_lee.Chiasm.metainfo.xml

  smoke-debian:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Chiasm-Linux-x86_64
          path: linux-artifacts
      - name: Install on Debian 12 and smoke-test both packages
        run: |
          chmod +x linux-artifacts/Chiasm-linux-x86_64.AppImage
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            debian:12-slim bash -euc '
              apt-get update
              apt-get install -y python3 ./linux-artifacts/Chiasm-linux-x86_64.deb
              python3 desktop/linux/smoke_launch.py /usr/bin/chiasm
              python3 desktop/linux/smoke_launch.py linux-artifacts/Chiasm-linux-x86_64.AppImage --appimage
            '

  attach-release-assets:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build, smoke-ubuntu, smoke-debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Chiasm-Linux-x86_64
          path: linux-artifacts
      - name: Attach Linux packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            linux-artifacts/Chiasm-linux-x86_64.deb
            linux-artifacts/Chiasm-linux-x86_64.AppImage
          fail_on_unmatched_files: true
