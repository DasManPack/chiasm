name: Tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt Multimedia system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse0
      - run: pip install pytest numpy mutagen requests PySide6
      - run: python -m compileall -q desktop/melodex provider-sdk/examples/ecosystem
      - name: Desktop tests
        env:
          PYTHONPATH: desktop
          QT_QPA_PLATFORM: offscreen
        run: pytest -q desktop/tests
      - name: Build and import the desktop wheel
        run: |
          wheel_dir="${RUNNER_TEMP}/melodex-wheel"
          install_dir="${RUNNER_TEMP}/melodex-wheel-install"
          python -m pip wheel --no-deps ./desktop --wheel-dir "$wheel_dir"
          python -m pip install --no-deps --target "$install_dir" "$wheel_dir"/melodex_desktop-*.whl
          PYTHONPATH="$install_dir" python -c 'import chiasm.field_model, chiasm.field_view, chiasm.arc_model, chiasm.relationship_model, chiasm.melodex_adapter, chiasm.artwork, melodex.chiasm_feature'
      - run: python scripts/docs_check.py
      - run: python scripts/navigation_check.py
      - run: python scripts/terminology_check.py
      - run: python scripts/ecosystem_check.py
      - run: python scripts/version_check.py
      - run: python scripts/release_check.py
      - run: python scripts/release_readiness.py
      - name: Provider SDK tests
        run: |
          pip install -e provider-sdk
          pytest -q provider-sdk/tests
          melodex-registry validate provider-sdk/registry/registry.json
          melodex-registry verify-packages provider-sdk/registry/registry.json --packages provider-sdk/registry/packages
          melodex-registry validate-reviews provider-sdk/registry/registry.json --reviews provider-sdk/registry/reviews


  code-health:
    name: Code health guardrails
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install code-health tooling
        run: python -m pip install "ruff>=0.9,<1"
      - name: Run Ruff correctness-debt ratchet
        run: python scripts/ruff_guardrail.py
      - name: Run structural ratchets
        run: python scripts/codebase_guardrails.py


  fluid-responsiveness:
    name: Fluid Chiasm release gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime for responsiveness scenarios
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - name: Install Fluid Chiasm test dependencies
        run: python -m pip install pytest numpy mutagen requests PySide6 keyring
      - name: Run Fluid Chiasm release gates
        env:
          PYTHONPATH: desktop
          QT_QPA_PLATFORM: offscreen
        run: python scripts/fluid_ci_gate.py


  visual-performance:
    name: Visual performance qualification
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime for visual probe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - name: Install visual probe dependencies
        run: python -m pip install PySide6
      - name: Measure Auto and High visual rendering
        env:
          PYTHONPATH: desktop
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/visual_performance_probe.py \
            --quality auto \
            --width 1280 \
            --height 720 \
            --frames 60 \
            --output visual-performance-auto-720p.json
          python scripts/visual_performance_probe.py \
            --quality high \
            --width 1920 \
            --height 1080 \
            --frames 45 \
            --output visual-performance-high-1080p.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-performance
          path: |
            visual-performance-auto-720p.json
            visual-performance-high-1080p.json


  visual-qa-captures:
    name: Visual QA captures
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime for capture suite
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - name: Install visual capture dependencies
        run: python -m pip install PySide6
      - name: Render visual QA set at desktop and laptop sizes
        env:
          PYTHONPATH: desktop
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/visual_qa_capture.py \
            --width 1440 \
            --height 900 \
            --output visual-qa/1440x900
          python scripts/visual_qa_capture.py \
            --width 1280 \
            --height 720 \
            --output visual-qa/1280x720
          python scripts/visual_qa_capture.py \
            --width 1024 \
            --height 640 \
            --output visual-qa/1024x640
      - name: Verify visual QA capture manifests
        run: |
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          viewports = (("1440x900", (1440, 900)), ("1280x720", (1280, 720)), ("1024x640", (1024, 640)))
          required_scenes = {
              "02-lyric-flow.png",
              "12-chiasm-50-album-lens.png",
              "13-chiasm-1200-album-playing-lens.png",
              "19-lyric-flow-page.png",
          }

          for name, size in viewports:
              folder = Path("visual-qa") / name
              manifest = json.loads((folder / "manifest.json").read_text(encoding="utf-8"))
              assert tuple(manifest["size"]) == size, (name, manifest["size"])
              assert manifest["reference_comparison"]["status"] == "pending"
              captures = manifest["captures"]
              files = [entry["file"] for entry in captures]
              assert len(files) >= 19, (name, len(files))
              assert len(files) == len(set(files)), (name, "duplicate capture filenames")
              missing = sorted(required_scenes - set(files))
              assert not missing, (name, "missing required scenes", missing)
              for filename in files:
                  image_path = folder / filename
                  with image_path.open("rb") as image_file:
                      header = image_file.read(24)
                  assert header[:8] == b"\x89PNG\r\n\x1a\n", (name, filename, "invalid PNG signature")
                  image_size = struct.unpack(">II", header[16:24])
                  assert image_size == size, (name, filename, image_size)
              print(f"{name}: verified {len(files)} PNG captures at {size[0]}x{size[1]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-captures
          path: visual-qa


  large-library-baseline:
    name: Large-library baseline (12.7k)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime for large-library probe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - name: Install desktop probe dependencies
        run: python -m pip install PySide6
      - name: Run 1k and 12.7k synthetic GUI baselines
        env:
          PYTHONPATH: desktop
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/large_library_probe.py \
            --tracks 1000 12700 \
            --gui \
            --output large-library-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: large-library-baseline
          path: large-library-baseline.json

