[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "melodex-desktop"
version = "0.7.13"
description = "Melodex — source-neutral music player with Flow and optional LLM control"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "numpy>=2.0", "mutagen>=1.47", "requests>=2.31", "keyring>=25,<26"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
melodex = "melodex.app:main"
melodex-mcp = "melodex.mcp_server:main"
melodex-openai-tools = "melodex.openai_tools:main"

[tool.setuptools]
packages = ["melodex", "melodex.providers", "chiasm"]

[tool.setuptools.package-data]
melodex = ["bundled_providers/*.mdxprovider", "assets/*.png"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# P12b starts with correctness-oriented checks only. Broader style rules are
# intentionally deferred until existing desktop debt is classified.
select = ["E9", "F63", "F7", "F82"]
